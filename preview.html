<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harmony website previews</title>
<meta name="robots" content="noindex">
<style>
  body { margin: 0; min-height: 100vh; background: #05070c; color: #eef2f8; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: grid; place-items: center; padding: 32px 18px; box-sizing: border-box; }
  h1 { font-size: clamp(26px, 4vw, 40px); margin: 0 0 6px; text-align: center; }
  p { color: #9aa5b5; text-align: center; margin: 0 0 28px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 18px; width: min(1000px, 100%); }
  a { position: relative; display: block; aspect-ratio: 16/10; border-radius: 20px; overflow: hidden; text-decoration: none; color: #fff; border: 1px solid rgba(255,255,255,.12); transition: transform .3s; }
  a:hover, a:focus-visible { transform: translateY(-4px); }
  a img { width: 100%; height: 100%; object-fit: cover; }
  a span { position: absolute; inset: auto 0 0; padding: 60px 22px 20px; background: linear-gradient(transparent, rgba(0,0,0,.85)); font-weight: 700; font-size: 22px; }
  a small { display: block; font-weight: 400; font-size: 14px; color: #c9d3e0; }
</style>
</head>
<body>
<main>
  <h1>Harmony website previews</h1>
  <p>Two sister sites. Best viewed full screen; scroll slowly to see the motion.</p>
  <div class="grid">
    <a href="labs/index.html"><img src="labs/media/hero.jpg" alt=""><span>Harmony Labs<small>Consulting, workflows, software, web, design, IT</small></span></a>
    <a href="mediaworks/index.html"><img src="mediaworks/media/podcast.jpg" alt=""><span>Harmony MediaWorks<small>Live streaming, editing, voiceover, channel management</small></span></a>
  </div>
</main>
</body>
</html>
